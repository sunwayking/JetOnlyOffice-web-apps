name: Check Mobile Runtime

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'

jobs:
  mobile-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run shared Runtime and editor provider tests
        shell: bash
        run: |
          node --test \
            apps/common/mobile/lib/runtime/createEditorRuntime.test.mjs \
            apps/documenteditor/mobile/src/lib/mobilePermissionPolicy.test.mjs \
            apps/documenteditor/mobile/src/lib/wordCommandAdapter.test.mjs \
            apps/documenteditor/mobile/src/lib/wordEditorRuntime.test.mjs \
            apps/spreadsheeteditor/mobile/test/commandProvider.test.mjs \
            apps/spreadsheeteditor/mobile/test/spreadsheetUiModel.test.mjs \
            apps/presentationeditor/mobile/test/commandProvider.test.mjs
